<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img"
    aria-labelledby="unit-circle-title unit-circle-description">
    <title id="unit-circle-title">Unit direction vector and its components</title>
    <desc id="unit-circle-description">A unit circle showing a direction vector and its cosine and sine components.</desc>
    <style>
        .li { visibility: visible; }
        .da { visibility: hidden; }
        @media (prefers-color-scheme: dark) {
            .li { visibility: hidden; }
            .da { visibility: visible; }
        }
    </style>
    <!-- Coordinate axes -->
    <defs>
        <marker class="li" id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="black"></polygon>
        </marker>

        <marker class="da" id="arrowheadda" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="white"></polygon>
        </marker>
    </defs>



    <!-- Grid lines (light) -->
    <circle cx="150" cy="150" r="100" fill="none" stroke="#ddd" stroke-dasharray="5,5"></circle>

    <!-- Axes -->
    <line class="li" x1="50" y1="150" x2="250" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"></line>
    <line class="li" x1="150" y1="250" x2="150" y2="50" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"></line>
    <line class="da" x1="50" y1="150" x2="250" y2="150" stroke="white" stroke-width="2" marker-end="url(#arrowheadda)"></line>
    <line class="da" x1="150" y1="250" x2="150" y2="50" stroke="white" stroke-width="2" marker-end="url(#arrowheadda)"></line>

    <!-- Axis labels -->
    <text class="li" x="260" y="155" font-family="serif" font-size="14">x</text>
    <text class="li" x="155" y="45" font-family="serif" font-size="14">y</text>

    <text class="da" fill="white" x="260" y="155" font-family="serif" font-size="14">x</text>
    <text class="da" fill="white" x="155" y="45" font-family="serif" font-size="14">y</text>

    <!-- Angle arc -->
    <path d="M 180 150 A 30 30 0 0 0 171.2 128.8" stroke="blue" stroke-width="2" fill="none"></path>
    <text x="185" y="140" font-family="serif" font-size="12" fill="blue">θ</text>

    <!-- Direction vector -->
    <line x1="150" y1="150" x2="220.7" y2="79.3" stroke="red" stroke-width="3" marker-end="url(#arrowhead)"></line>
    <text x="150" y="105" font-family="serif" font-size="12" fill="red">direction</text>

    <!-- Components -->
    <line x1="150" y1="150" x2="220.7" y2="150" stroke="green" stroke-width="2"></line>
    <text x="180" y="165" font-family="serif" font-size="12" fill="green">cos(θ)</text>

    <line x1="220.7" y1="150" x2="220.7" y2="79.3" stroke="orange" stroke-width="2"></line>
    <text x="225" y="115" font-family="serif" font-size="12" fill="orange">sin(θ)</text>

    <!-- Dotted projection -->
    <line x1="220.7" y1="150" x2="220.7" y2="79.3" stroke="gray" stroke-width="1" stroke-dasharray="3,3"></line>

    <!-- Points -->
    <circle class="li" cx="150" cy="150" r="3" fill="black"></circle>
    <circle class="da" cx="150" cy="150" r="3" fill="white"></circle>
    <text class="li" fill="black" x="125" y="170" font-family="serif" font-size="12">(0, 0)</text>
    <text class="da" fill="white" x="125" y="170" font-family="serif" font-size="12">(0, 0)</text>

    <circle cx="220.7" cy="79.3" r="3" fill="red"></circle>
    <text class="li" fill="black" x="225" y="75" font-family="serif" font-size="12">(cos(θ), sin(θ))</text>
    <text class="da" fill="white" x="225" y="75" font-family="serif" font-size="12">(cos(θ), sin(θ))</text>
</svg>
